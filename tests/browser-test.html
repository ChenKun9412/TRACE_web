<!doctype html>
<html lang="en">
  <head><meta charset="utf-8"><title>TRACE browser test</title></head>
  <body data-status="RUNNING">
    <pre id="output">RUNNING</pre>
    <form id="trace-form">
      <input id="height" required>
      <label><input type="radio" name="inputSource" value="manual" checked>Manual</label>
      <label><input type="radio" name="inputSource" value="file">File</label>
      <div id="manual-panel">
        <input id="trachea-length" required>
        <input id="trachea-radius" required>
        <input id="lung-volume" required>
        <select id="lung-volume-unit"><option value="ml">mL</option></select>
      </div>
      <div id="file-panel" hidden>
        <input id="feature-file" type="file" disabled>
        <dl id="file-preview" hidden>
          <div><dd id="feature-file-name"></dd></div>
          <div><dd id="feature-volume"></dd></div>
          <div><dd id="feature-length"></dd></div>
          <div><dd id="feature-radius"></dd></div>
        </dl>
      </div>
      <button type="submit">Calculate</button>
    </form>
    <p id="form-error" hidden></p>
    <section id="results" hidden>
      <span id="score-value"></span>
      <span id="risk-value"></span>
      <span id="risk-range"></span>
      <div id="phenotype-grid"></div>
      <i id="score-marker"></i>
    </section>
    <script src="../assets/reference-data.js"></script>
    <script src="../assets/calculator.js"></script>
    <script src="../assets/app.js"></script>
    <script>
      (async function () {
        const output = document.getElementById("output");
        function assert(condition, message) {
          if (!condition) throw new Error(message);
        }
        async function waitFor(condition, message) {
          for (let attempt = 0; attempt < 100; attempt += 1) {
            if (condition()) return;
            await new Promise((resolve) => window.setTimeout(resolve, 10));
          }
          throw new Error(message);
        }
        try {
          const median = TRACECalculator.calculate({
            tracheaLengthMm: 76.393482,
            tracheaRadiusMm: 6.366434,
            lungVolumeMl: 3773.749,
            heightCm: 163,
          }, TRACE_REFERENCE);
          assert(median.score === 3, `median-like score: ${median.score}`);
          assert(median.riskGroup === "Intermediate", `median-like risk: ${median.riskGroup}`);

          const low = TRACECalculator.calculate({
            tracheaLengthMm: 50,
            tracheaRadiusMm: 10,
            lungVolumeMl: 1200,
            heightCm: 190,
          }, TRACE_REFERENCE);
          assert(low.score === 0 && low.riskGroup === "Low", "low case failed");

          const high = TRACECalculator.calculate({
            tracheaLengthMm: 130,
            tracheaRadiusMm: 3.5,
            lungVolumeMl: 9900,
            heightCm: 133,
          }, TRACE_REFERENCE);
          assert(high.score === 6 && high.riskGroup === "High", "high case failed");

          assert(
            Math.abs(median.phenotypes.TLTI.raw - Math.log(76.393482 / 6.366434)) < 1e-12,
            "TLTI formula failed",
          );

          const parsed = TRACECalculator.parseFeatureFile(
            "trachea_length,trachea_radius_avg,total_lung_volume_mm3\n76.393482,6.366434,3773749",
            "features.csv",
          );
          assert(parsed.lungVolumeMl === 3773.749, "feature-file volume conversion failed");
          const parsedJson = TRACECalculator.parseFeatureFile(JSON.stringify({
            trachea_length: 76.393482,
            trachea_radius_avg: 6.366434,
            total_lung_volume_mm3: 3773749,
          }), "features.json");
          assert(parsedJson.tracheaLengthMm === parsed.tracheaLengthMm, "JSON feature parsing failed");
          let multipleRowsRejected = false;
          try {
            TRACECalculator.parseFeatureFile(
              "trachea_length,trachea_radius_avg,total_lung_volume_mm3\n76,6,3700000\n77,7,3800000",
              "features.csv",
            );
          } catch (error) {
            multipleRowsRejected = /exactly one subject record/.test(error.message);
          }
          assert(multipleRowsRejected, "multiple feature records were not rejected");

          const fileRadio = document.querySelector('input[name="inputSource"][value="file"]');
          fileRadio.checked = true;
          fileRadio.dispatchEvent(new Event("change"));
          assert(document.getElementById("manual-panel").hidden, "manual panel did not hide");
          assert(!document.getElementById("file-panel").hidden, "file panel did not show");
          assert(document.getElementById("feature-file").required, "feature file is not required in file mode");

          const featureFile = new File([
            "trachea_length,trachea_radius_avg,total_lung_volume_mm3\n76.393482,6.366434,3773749",
          ], "features.csv", { type: "text/csv" });
          const fileTransfer = new DataTransfer();
          fileTransfer.items.add(featureFile);
          document.getElementById("feature-file").files = fileTransfer.files;
          document.getElementById("feature-file").dispatchEvent(new Event("change"));
          document.getElementById("height").value = 163;
          await waitFor(
            () => !document.getElementById("file-preview").hidden,
            "feature preview did not render",
          );
          document.getElementById("trace-form").requestSubmit();
          await new Promise((resolve) => window.setTimeout(resolve, 0));
          assert(document.getElementById("score-value").textContent === "3", "file-mode score failed");

          const manualRadio = document.querySelector('input[name="inputSource"][value="manual"]');
          manualRadio.checked = true;
          manualRadio.dispatchEvent(new Event("change"));

          document.getElementById("trachea-length").value = 76.393482;
          document.getElementById("trachea-radius").value = 6.366434;
          document.getElementById("lung-volume").value = 3773.749;
          document.getElementById("height").value = 163;
          document.getElementById("trace-form").requestSubmit();
          await new Promise((resolve) => window.setTimeout(resolve, 0));
          assert(!document.getElementById("results").hidden, "results did not render");
          assert(document.getElementById("score-value").textContent === "3", "rendered score failed");
          assert(document.getElementById("risk-value").textContent === "Intermediate risk", "rendered risk label failed");
          assert(!/[\u3400-\u9fff]/.test(document.getElementById("phenotype-grid").textContent), "dynamic interface contains Chinese text");
          document.body.dataset.status = "PASS";
          output.textContent = "PASS: browser calculator and interface assertions completed";
        } catch (error) {
          document.body.dataset.status = "FAIL";
          output.textContent = `FAIL: ${error.message}`;
        }
      })();
    </script>
  </body>
</html>
